<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" type="image/png" href="images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="contact">
  <header class="site-header">
    <div class="top-bar">
      <div class="top-bar__left">
        <span>USD</span>
        <a href="shop.html">Stores</a>
      </div>
      <a class="top-bar__right" href="login-register.html">Login / Register</a>
    </div>
    <div class="main-nav">
      <a class="brand" href="index.html" aria-label="ABOKICHI home">

      </a>
      <nav class="nav-links" data-nav-menu>
        <a href="shop.html">Shop</a>
        <a href="index.html#story">Our story</a>

        <button class="icon-button" type="button" aria-label="Wishlist">
          <span class="icon-heart"></span>
